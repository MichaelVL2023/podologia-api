{
  "openapi": "3.0.3",
  "info": {
    "title": "API Reserva de Citas - Consultorio de Podología",
    "version": "2.0.0",
    "description": "Contrato de la API (design-first). Las pacientes se registran, eligen un servicio y reservan un horario libre de la podóloga. La podóloga (ADMIN) administra su agenda, atiende, registra la consulta y el cobro (efectivo o Yape, en el consultorio). Todos los endpoints exigen un token JWT (bearerAuth), salvo registro, login y catálogo. Roles. ADMIN es la podóloga; USUARIO es la paciente. Cada operación indica sus roles en x-roles. Una paciente solo accede a sus propios datos.\n"
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "Desarrollo local"
    }
  ],
  "tags": [
    {
      "name": "Autenticación",
      "description": "Registro, inicio de sesión y datos de la sesión actual"
    },
    {
      "name": "Servicios",
      "description": "Catálogo de servicios con duración y precio"
    },
    {
      "name": "Horarios",
      "description": "Horario de atención semanal y bloqueos de la podóloga"
    },
    {
      "name": "Disponibilidad",
      "description": "Horarios libres para reservar"
    },
    {
      "name": "Citas",
      "description": "Reserva y gestión de citas"
    },
    {
      "name": "Pacientes",
      "description": "Fichas de pacientes"
    },
    {
      "name": "Consultas",
      "description": "Atenciones realizadas (historia clínica y monto a cobrar)"
    },
    {
      "name": "Pagos",
      "description": "Cobros registrados por consulta (efectivo o Yape)"
    },
    {
      "name": "Reportes",
      "description": "Resúmenes de ingresos y saldos"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/auth/registro": {
      "post": {
        "tags": [
          "Autenticación"
        ],
        "operationId": "registrarse",
        "summary": "La paciente crea su cuenta",
        "description": "Crea la cuenta con rol USUARIO y su ficha de paciente enlazada, e inicia sesión. Si ya existe una ficha creada por la podóloga con el mismo DNI y sin cuenta, la cuenta se enlaza a esa ficha.\n",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RegistroRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Cuenta creada y sesión iniciada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SesionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "409": {
            "$ref": "#/components/responses/Conflicto"
          }
        }
      }
    },
    "/api/auth/login": {
      "post": {
        "tags": [
          "Autenticación"
        ],
        "operationId": "iniciarSesion",
        "summary": "Inicia sesión y devuelve un token JWT",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Sesión iniciada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SesionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "description": "Correo o contraseña incorrectos, o cuenta inactiva",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/auth/me": {
      "get": {
        "tags": [
          "Autenticación"
        ],
        "operationId": "obtenerSesionActual",
        "summary": "Devuelve el usuario autenticado",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "responses": {
          "200": {
            "description": "Usuario de la sesión actual",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Usuario"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          }
        }
      }
    },
    "/api/auth/contrasena": {
      "put": {
        "tags": [
          "Autenticación"
        ],
        "operationId": "cambiarContrasena",
        "summary": "Cambia la contraseña del usuario autenticado",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CambioContrasenaRequest"
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Contraseña actualizada"
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          }
        }
      }
    },
    "/api/servicios": {
      "get": {
        "tags": [
          "Servicios"
        ],
        "operationId": "listarServicios",
        "summary": "Lista el catálogo de servicios",
        "description": "Devuelve los servicios activos. Si el usuario es ADMIN y envía incluirInactivos=true, también devuelve los inactivos.\n",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "parameters": [
          {
            "name": "incluirInactivos",
            "in": "query",
            "description": "Solo tiene efecto para ADMIN",
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Lista de servicios",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Servicio"
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          }
        }
      },
      "post": {
        "tags": [
          "Servicios"
        ],
        "operationId": "crearServicio",
        "summary": "Crea un servicio",
        "x-roles": [
          "ADMIN"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ServicioRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Servicio creado",
            "headers": {
              "Location": {
                "description": "URL del servicio creado",
                "schema": {
                  "type": "string"
                },
                "example": "/api/v1/servicios/2"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Servicio"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          }
        }
      }
    },
    "/api/servicios/{id}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ServicioId"
        }
      ],
      "get": {
        "tags": [
          "Servicios"
        ],
        "operationId": "obtenerServicio",
        "summary": "Obtiene un servicio por id",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "responses": {
          "200": {
            "description": "Servicio encontrado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Servicio"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "404": {
            "$ref": "#/components/responses/NoEncontrado"
          }
        }
      },
      "put": {
        "tags": [
          "Servicios"
        ],
        "operationId": "actualizarServicio",
        "summary": "Actualiza un servicio o lo desactiva",
        "description": "Los servicios no se eliminan; se desactivan con activo=false.",
        "x-roles": [
          "ADMIN"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ServicioRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Servicio actualizado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Servicio"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          },
          "404": {
            "$ref": "#/components/responses/NoEncontrado"
          }
        }
      }
    },
    "/api/horarios/semanal": {
      "get": {
        "tags": [
          "Horarios"
        ],
        "operationId": "obtenerHorarioSemanal",
        "summary": "Devuelve el horario de atención semanal",
        "description": "Puede haber varios bloques por día (por ejemplo, mañana y tarde).",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "responses": {
          "200": {
            "description": "Bloques de atención",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HorarioSemanal"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          }
        }
      },
      "put": {
        "tags": [
          "Horarios"
        ],
        "operationId": "reemplazarHorarioSemanal",
        "summary": "Reemplaza el horario de atención semanal completo",
        "x-roles": [
          "ADMIN"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/HorarioSemanal"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Horario actualizado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HorarioSemanal"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          }
        }
      }
    },
    "/api/horarios/bloqueos": {
      "get": {
        "tags": [
          "Horarios"
        ],
        "operationId": "listarBloqueos",
        "summary": "Lista los bloqueos de agenda (vacaciones, feriados, permisos)",
        "x-roles": [
          "ADMIN"
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/Desde"
          },
          {
            "$ref": "#/components/parameters/Hasta"
          }
        ],
        "responses": {
          "200": {
            "description": "Lista de bloqueos",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Bloqueo"
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          }
        }
      },
      "post": {
        "tags": [
          "Horarios"
        ],
        "operationId": "crearBloqueo",
        "summary": "Bloquea un rango de la agenda",
        "description": "Las citas ya reservadas dentro del rango no se cancelan automáticamente; la respuesta 409 lo indica.",
        "x-roles": [
          "ADMIN"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/BloqueoRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Bloqueo creado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Bloqueo"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          },
          "409": {
            "$ref": "#/components/responses/Conflicto"
          }
        }
      }
    },
    "/api/horarios/bloqueos/{id}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/BloqueoId"
        }
      ],
      "delete": {
        "tags": [
          "Horarios"
        ],
        "operationId": "eliminarBloqueo",
        "summary": "Elimina un bloqueo de agenda",
        "x-roles": [
          "ADMIN"
        ],
        "responses": {
          "204": {
            "description": "Bloqueo eliminado"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          },
          "404": {
            "$ref": "#/components/responses/NoEncontrado"
          }
        }
      }
    },
    "/api/disponibilidad": {
      "get": {
        "tags": [
          "Disponibilidad"
        ],
        "operationId": "consultarDisponibilidad",
        "summary": "Horarios libres de un día para un servicio",
        "description": "Calcula los horarios de inicio posibles según el horario semanal, la duración del servicio, los bloqueos y las citas ya reservadas (estado RESERVADA). No devuelve horarios pasados.\n",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "parameters": [
          {
            "name": "servicioId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            },
            "example": 2
          },
          {
            "name": "fecha",
            "in": "query",
            "required": true,
            "description": "Día a consultar (yyyy-MM-dd)",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-11-24"
          }
        ],
        "responses": {
          "200": {
            "description": "Horarios libres, vacío si no hay",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Disponibilidad"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "404": {
            "$ref": "#/components/responses/NoEncontrado"
          }
        }
      }
    },
    "/api/citas": {
      "get": {
        "tags": [
          "Citas"
        ],
        "operationId": "listarCitas",
        "summary": "Lista citas con filtros y paginación",
        "description": "ADMIN ve todas las citas y puede filtrar por paciente. USUARIO ve solo las suyas y se ignora pacienteId. Ordenadas por inicio ascendente.\n",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "parameters": [
          {
            "name": "fecha",
            "in": "query",
            "description": "Solo las citas de este día",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-11-24"
          },
          {
            "name": "pacienteId",
            "in": "query",
            "description": "Solo las citas de este paciente (solo ADMIN)",
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          },
          {
            "name": "estado",
            "in": "query",
            "description": "Solo las citas en este estado",
            "schema": {
              "$ref": "#/components/schemas/EstadoCita"
            }
          },
          {
            "$ref": "#/components/parameters/Pagina"
          },
          {
            "$ref": "#/components/parameters/Tamano"
          }
        ],
        "responses": {
          "200": {
            "description": "Página de citas",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PaginaCitas"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          }
        }
      },
      "post": {
        "tags": [
          "Citas"
        ],
        "operationId": "reservarCita",
        "summary": "Reserva una cita",
        "description": "La cita nace en estado RESERVADA y el fin se calcula con la duración del servicio. Si el horario ya no está libre responde 409 con el código HORARIO_NO_DISPONIBLE. USUARIO reserva para sí misma; ADMIN puede indicar pacienteId para reservar a nombre de una paciente.\n",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CitaRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Cita reservada",
            "headers": {
              "Location": {
                "description": "URL de la cita creada",
                "schema": {
                  "type": "string"
                },
                "example": "/api/v1/citas/40"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Cita"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "404": {
            "$ref": "#/components/responses/NoEncontrado"
          },
          "409": {
            "$ref": "#/components/responses/Conflicto"
          }
        }
      }
    },
    "/api/citas/{id}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/CitaId"
        }
      ],
      "get": {
        "tags": [
          "Citas"
        ],
        "operationId": "obtenerCita",
        "summary": "Obtiene una cita por id",
        "description": "USUARIO solo puede ver sus propias citas.",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "responses": {
          "200": {
            "description": "Cita encontrada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Cita"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          },
          "404": {
            "$ref": "#/components/responses/NoEncontrado"
          }
        }
      }
    },
    "/api/citas/{id}/reprogramacion": {
      "parameters": [
        {
          "$ref": "#/components/parameters/CitaId"
        }
      ],
      "put": {
        "tags": [
          "Citas"
        ],
        "operationId": "reprogramarCita",
        "summary": "Cambia el horario de una cita reservada",
        "description": "Solo citas en estado RESERVADA. El nuevo horario debe estar libre.",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReprogramacionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Cita reprogramada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Cita"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SolicitudInvalida"
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          },
          "404": {
            "$ref": "#/components/responses/NoEncontrado"
          },
          "409": {
            "$ref": "#/components/responses/Conflicto"
          }
        }
      }
    },
    "/api/citas/{id}/cancelacion": {
      "parameters": [
        {
          "$ref": "#/components/parameters/CitaId"
        }
      ],
      "post": {
        "tags": [
          "Citas"
        ],
        "operationId": "cancelarCita",
        "summary": "Cancela una cita reservada",
        "description": "Solo citas en estado RESERVADA. Libera el horario.",
        "x-roles": [
          "ADMIN",
          "USUARIO"
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CancelacionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Cita cancelada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Cita"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/NoAutenticado"
          },
          "403": {
            "$ref": "#/components/responses/SinPermiso"
          },
          "404": {
            "$ref": "#/components/responses/NoEncontrado"
          },
          "409": {
            "$ref": "#/components/responses/Conflicto"
          }
        }
      }
    },
    "/api/citas/{id}/estado": {
      "parameters": [
        {
          "$ref": "#/components/parameters/CitaId"
        }
      ],
      "patch": {
        "tags": [
          "Citas"
        ],
        "operationId": "cambiarEstadoCita",
        "summary": "Marca una cita como ATENDIDA o NO_ASISTIO",
        "x-roles": [
          "ADMIN"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CambioEstadoCitaRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
