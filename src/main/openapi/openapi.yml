  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Token JWT obtenido en POST /api/v1/auth/login o /api/v1/auth/registro. Se envía en el encabezado Authorization con el formato Bearer seguido del token. El rol (ADMIN o USUARIO) va dentro del token.\n"
      }
    },
    "parameters": {
      "PacienteId": {
        "name": "id",
        "in": "path",
        "required": true,
        "description": "Identificador de la paciente",
        "schema": {
          "type": "integer",
          "format": "int64"
        },
        "example": 15
      },
      "CitaId": {
        "name": "id",
        "in": "path",
        "required": true,
        "description": "Identificador de la cita",
        "schema": {
          "type": "integer",
          "format": "int64"
        },
        "example": 40
      },
      "ConsultaId": {
        "name": "id",
        "in": "path",
        "required": true,
        "description": "Identificador de la consulta",
        "schema": {
          "type": "integer",
          "format": "int64"
        },
        "example": 120
      },
      "PagoId": {
        "name": "id",
        "in": "path",
        "required": true,
        "description": "Identificador del pago",
        "schema": {
          "type": "integer",
          "format": "int64"
        },
        "example": 300
      },
      "ServicioId": {
        "name": "id",
        "in": "path",
        "required": true,
        "description": "Identificador del servicio",
        "schema": {
          "type": "integer",
          "format": "int64"
        },
        "example": 2
      },
      "BloqueoId": {
        "name": "id",
        "in": "path",
        "required": true,
        "description": "Identificador del bloqueo",
        "schema": {
          "type": "integer",
          "format": "int64"
        },
        "example": 7
      },
      "Pagina": {
        "name": "pagina",
        "in": "query",
        "description": "Número de página (empieza en 0)",
        "schema": {
          "type": "integer",
          "minimum": 0,
          "default": 0
        }
      },
      "Tamano": {
        "name": "tamano",
        "in": "query",
        "description": "Cantidad de registros por página",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      },
      "Desde": {
        "name": "desde",
        "in": "query",
        "description": "Fecha inicial, inclusive (yyyy-MM-dd)",
        "schema": {
          "type": "string",
          "format": "date"
        },
        "example": "2026-11-01"
      },
      "Hasta": {
        "name": "hasta",
        "in": "query",
        "description": "Fecha final, inclusive (yyyy-MM-dd)",
        "schema": {
          "type": "string",
          "format": "date"
        },
        "example": "2026-11-30"
      }
    },
    "responses": {
      "SolicitudInvalida": {
        "description": "Datos inválidos",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "NoAutenticado": {
        "description": "Falta el token, es inválido o está vencido",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "SinPermiso": {
        "description": "El rol del usuario no permite esta operación, o el recurso es de otra paciente",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "NoEncontrado": {
        "description": "Recurso no encontrado",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Conflicto": {
        "description": "La operación entra en conflicto con datos existentes",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "schemas": {
      "Rol": {
        "type": "string",
        "enum": [
          "ADMIN",
          "USUARIO"
        ],
        "example": "USUARIO"
      },
      "RegistroRequest": {
        "type": "object",
        "required": [
          "nombres",
